name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -s -l .)" || { gofmt -s -d .; exit 1; }
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
      - name: shellcheck
        run: shellcheck install.sh scripts/*.sh
      - name: fixtures are up to date
        run: |
          python3 testdata/gen_fixtures.py
          git diff --exit-code -- testdata

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build static binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath \
            -ldflags "-s -w -X github.com/KVM-X/KVM-X/internal/cli.Version=ci-${GITHUB_SHA::7}" \
            -o kvmx-linux-${{ matrix.goarch }} ./cmd/kvmx
          file kvmx-linux-${{ matrix.goarch }}
      - uses: actions/upload-artifact@v7
        with:
          name: kvmx-linux-${{ matrix.goarch }}
          path: kvmx-linux-${{ matrix.goarch }}

  integration:
    name: integration (real TCG boots)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install qemu
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils seabios
      - name: cache test guest
        uses: actions/cache@v5
        with:
          path: ~/.cache/kvmx
          key: kvmx-guest-alpine-3.24.4-${{ runner.os }}
      - name: build
        run: CGO_ENABLED=0 go build -o bin/kvmx ./cmd/kvmx
      - name: integration tests
        env:
          KVMX_BIN: ${{ github.workspace }}/bin/kvmx
          KVMX_SKIP_DISTROS: "1"
        run: go test -tags integration -count=1 -timeout 25m -v ./test/...

  distros:
    name: distro ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        image:
          - alpine:3.24
          - debian:12-slim
          - ubuntu:24.04
          - fedora:latest
          - rockylinux:9
          - archlinux:latest
          - opensuse/tumbleweed:latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: cache test guest
        uses: actions/cache@v5
        with:
          path: ~/.cache/kvmx
          key: kvmx-guest-alpine-3.24.4-${{ runner.os }}
      - name: build
        run: CGO_ENABLED=0 go build -o bin/kvmx ./cmd/kvmx
      - name: enable -> boot under TCG -> shim -> revert, inside ${{ matrix.image }}
        env:
          KVMX_BIN: ${{ github.workspace }}/bin/kvmx
          KVMX_DISTROS: ${{ matrix.image }}
          KVMX_SKIP_DOCKER: "0"
        run: go test -tags integration -count=1 -timeout 30m -v -run TestDistroMatrix ./test/...

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: kvmx:ci
      - name: image smoke test
        run: |
          docker run --rm kvmx:ci version
          docker run --rm kvmx:ci status --json || test $? -eq 10
