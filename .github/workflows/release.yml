name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test
        run: go test -count=1 ./...
      - name: build static linux/${{ matrix.goarch }} binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath \
            -ldflags "-s -w -X github.com/KVM-X/KVM-X/internal/cli.Version=${GITHUB_REF_NAME} -X github.com/KVM-X/KVM-X/internal/cli.Commit=${GITHUB_SHA::7}" \
            -o kvmx-linux-${{ matrix.goarch }} ./cmd/kvmx
      - uses: actions/upload-artifact@v7
        with:
          name: kvmx-linux-${{ matrix.goarch }}
          path: kvmx-linux-${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: |
          chmod +x kvmx-linux-*
          sha256sum kvmx-linux-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/kvmx-linux-amd64
            dist/kvmx-linux-arm64
            dist/SHA256SUMS
            install.sh

  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:latest
