<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="t d">
  <title id="t">KVM-X</title>
  <desc id="d">KVM-X climbs a ladder from software emulation to nested KVM to hardware KVM so VMs work on VPSes and containers without nested virtualization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b34"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <g opacity="0.08" stroke="#94a3b8">
    <path d="M0 60H1280M0 120H1280M0 180H1280M0 240H1280M0 300H1280"/>
    <path d="M160 0V360M320 0V360M480 0V360M640 0V360M800 0V360M960 0V360M1120 0V360"/>
  </g>

  <text x="72" y="170" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="128" font-weight="800" letter-spacing="-4" fill="url(#word)" filter="url(#glow)">KVM-X</text>
  <text x="76" y="222" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#cbd5e1">Virtualization on machines that say no.</text>
  <text x="76" y="268" font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="20" fill="#7dd3fc">$ kvmx doctor &#8250; enable &#8250; run</text>

  <!-- the ladder -->
  <g font-family="'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" font-size="20" font-weight="600">
    <g transform="translate(790 52)">
      <rect width="420" height="72" rx="14" fill="#052e2b" stroke="#34d399" stroke-width="2"/>
      <circle cx="36" cy="36" r="10" fill="#34d399"/>
      <text x="64" y="32" fill="#a7f3d0">HARDWARE-KVM</text>
      <text x="64" y="56" font-size="15" font-weight="400" fill="#6ee7b7">near-native</text>
    </g>
    <g transform="translate(790 144)">
      <rect width="420" height="72" rx="14" fill="#0c2a3d" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="36" cy="36" r="10" fill="#38bdf8"/>
      <text x="64" y="32" fill="#bae6fd">NESTED-KVM</text>
      <text x="64" y="56" font-size="15" font-weight="400" fill="#7dd3fc">KVM inside a VM</text>
    </g>
    <g transform="translate(790 236)">
      <rect width="420" height="72" rx="14" fill="#33220a" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="36" cy="36" r="10" fill="#fbbf24"/>
      <text x="64" y="32" fill="#fde68a">SOFTWARE-EMULATION (TCG)</text>
      <text x="64" y="56" font-size="15" font-weight="400" fill="#fcd34d">works anywhere, never mislabelled</text>
    </g>
  </g>
  <g stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M760 272V96"/>
    <path d="M748 112L760 96L772 112"/>
  </g>
</svg>
